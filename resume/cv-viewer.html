    <!-- Prevent theme flash -->

    <script>
        (function () {
            try {
                const savedTheme =
                    localStorage.getItem("site-theme");

                const systemDark =
                    window.matchMedia(
                        "(prefers-color-scheme: dark)"
                    ).matches;

                const theme =
                    savedTheme ||
                    (systemDark ? "dark" : "light");

                document.documentElement.dataset.theme =
                    theme;

                document.documentElement.style.colorScheme =
                    theme;

            } catch (error) {
                document.documentElement.dataset.theme =
                    "light";

                document.documentElement.style.colorScheme =
                    "light";
            }
        })();
    </script>

    <style>
        /* Base */

        html {
            scrollbar-gutter: stable;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* CV viewer */

        .cv-viewer {
            position: relative;

            width: 768px;
            max-width: calc(100vw - 48px);

            height: calc(100dvh - 50px);

            margin: 0 auto;

            min-height: 0;

            overflow: hidden;
        }

        /* PDF scroll area */

        .cv-pdf-scroll {
            width: 100%;
            height: 100%;

            overflow-y: auto;
            overflow-x: hidden;

            -webkit-overflow-scrolling: touch;

            overscroll-behavior-y: contain;

            scrollbar-gutter: stable;
        }

        /* PDF page */

        .cv-pdf-page {
            display: block;

            max-width: 100%;
            height: auto;

            margin: 0 auto 16px;

            background: #ffffff;

            box-shadow:
                0 1px 5px rgba(15, 23, 42, 0.14);

            user-select: none;
            -webkit-user-select: none;

            -webkit-touch-callout: none;

            image-rendering: auto;
        }

        /* Loading */

        .cv-loading {
            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 180px;

            padding: 32px;

            color: var(--text-muted);

            font-family:
                "Source Sans 3",
                Arial,
                sans-serif;

            font-size: 14px;
        }

        /* Error fallback */

        .pdf-fallback {
            padding: 32px 24px;

            color: var(--text-main);

            text-align: center;

            font-family:
                "Source Sans 3",
                Arial,
                sans-serif;
        }

        .pdf-fallback a {
            color: var(--accent-red);

            font-weight: 600;
        }

        /* Fullscreen */

        .cv-fullscreen-btn {
            position: absolute;

            left: calc(100% + 12px);
            top: 8px;

            width: 36px;
            height: 36px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 0;

            border: 1px solid var(--border-color, #ccc);

            border-radius: 8px;

            background:
                var(--bg-main, #fff);

            color:
                var(--text-main);

            cursor: pointer;

            font-size: 15px;

            z-index: 100;
        }

        .cv-fullscreen-btn:hover {
            opacity: 0.75;
        }

        /* Desktop */

        @media (min-width: 1024px) {

            .desktop-header {
                position: sticky;

                top: 0;

                z-index: 9999;
            }

            .cv-page .desktop-theme-toggle {
                margin: 0 !important;
                margin-left: 0 !important;
            }

            .cv-pdf-scroll {
                padding-top: 0;
            }
        }

        /* Mobile */

        @media (max-width: 1023px) {

            html,
            body {
                width: 100%;
                height: 100%;

                overflow: hidden;
            }

            body.cv-page {
                padding-bottom: 0;
            }

            .desktop-header {
                display: none !important;
            }

            .cv-viewer {
                width: 100%;

                max-width: none;

                height:
                    calc(100dvh - 54px - 92px);

                margin: 0;

                min-height: 0;
            }

            .cv-pdf-scroll {
                width: 100%;
                height: 100%;

                padding:
                    8px 8px 20px;

                overflow-y: auto;
                overflow-x: hidden;

                -webkit-overflow-scrolling: touch;

                overscroll-behavior-y: contain;
            }

            .cv-pdf-page {
                width: 100%;

                max-width: 768px;

                margin:
                    0 auto 12px;

                box-shadow:
                    0 1px 5px rgba(15, 23, 42, 0.14);
            }

            .cv-fullscreen-btn {
                display: none;
            }

            .cv-loading {
                min-height: 120px;
            }
        }

        /* Reduced motion */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;

                transition-duration:
                    0.01ms !important;

                animation-duration:
                    0.01ms !important;
            }
        }

        /* Print */

        @media print {

            .desktop-header,
            .mobile-topbar,
            .mobile-bottom-nav,
            .cv-fullscreen-btn {
                display: none !important;
            }

            .cv-viewer {
                width: 100%;

                height: auto;

                max-width: none;
            }

            .cv-pdf-scroll {
                overflow: visible;
            }

            .cv-pdf-page {
                width: 100%;

                margin: 0;

                box-shadow: none;
            }
        }

    <!-- PDF.js viewer -->

    <script type="module">

        import * as pdfjsLib from
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

        /* PDF.js worker */

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

        /* Elements */

        const cvViewer =
            document.getElementById(
                "cv-document"
            );

        const pdfScroll =
            document.getElementById(
                "cvPdfScroll"
            );

        const loading =
            document.getElementById(
                "cvLoading"
            );

        const fullscreenBtn =
            document.getElementById(
                "fullscreenBtn"
            );

        /* PDF */

        const pdfUrl =
            "../pdfs/CV_Nazmul_Huda_Badhon.pdf";

        let pdf = null;

        let rendering = false;

        let renderQueued = false;

        /* Get display scale */

        function getCssScale(page) {

            const baseViewport =
                page.getViewport({
                    scale: 1
                });

            const availableWidth =
                Math.max(
                    pdfScroll.clientWidth,
                    1
                );

            const isMobile =
                window.matchMedia(
                    "(max-width: 1023px)"
                ).matches;

            let targetWidth;

            if (isMobile) {

                targetWidth =
                    Math.min(
                        availableWidth,
                        768
                    );

            } else {

                targetWidth = 768;

            }

            return (
                targetWidth /
                baseViewport.width
            );
        }

        /* Get high-resolution render scale */

        function getOutputScale() {

            const dpr =
                window.devicePixelRatio || 1;

            return Math.min(
                Math.max(dpr, 2),
                3
            );
        }

        /* Render one page */

        async function renderPage(
            page,
            pageNumber
        ) {

            const cssScale =
                getCssScale(page);

            const outputScale =
                getOutputScale();

            const cssViewport =
                page.getViewport({
                    scale: cssScale
                });

            const renderViewport =
                page.getViewport({
                    scale:
                        cssScale *
                        outputScale
                });

            const canvas =
                document.createElement(
                    "canvas"
                );

            const context =
                canvas.getContext(
                    "2d",
                    {
                        alpha: false,
                        willReadFrequently: false
                    }
                );

            if (!context) {

                throw new Error(
                    "Unable to create canvas context."
                );

            }

            /* Use high-resolution internal pixels */

            canvas.width =
                Math.ceil(
                    renderViewport.width
                );

            canvas.height =
                Math.ceil(
                    renderViewport.height
                );

            /* Display at normal CSS size */

            canvas.style.width =
                `${cssViewport.width}px`;

            canvas.style.height =
                `${cssViewport.height}px`;

            canvas.className =
                "cv-pdf-page";

            canvas.setAttribute(
                "data-page-number",
                pageNumber
            );

            pdfScroll.appendChild(
                canvas
            );

            /* Render PDF */

            await page.render({

                canvasContext:
                    context,

                viewport:
                    renderViewport

            }).promise;

        }

        /* Remove rendered pages */

        function clearPages() {

            const pages =
                pdfScroll.querySelectorAll(
                    ".cv-pdf-page"
                );

            pages.forEach(
                page => page.remove()
            );
        }

        /* Render complete PDF */

        async function renderPdf() {

            if (!pdf) {
                return;
            }

            if (rendering) {

                renderQueued = true;

                return;
            }

            rendering = true;

            renderQueued = false;

            try {

                clearPages();

                for (
                    let pageNumber = 1;
                    pageNumber <= pdf.numPages;
                    pageNumber++
                ) {

                    const page =
                        await pdf.getPage(
                            pageNumber
                        );

                    await renderPage(
                        page,
                        pageNumber
                    );

                }

            } catch (error) {

                console.error(
                    "PDF rendering failed:",
                    error
                );

            } finally {

                rendering = false;

                if (renderQueued) {

                    renderPdf();

                }

            }
        }

        /* Load PDF */

        async function loadPdf() {

            try {

                const loadingTask =
                    pdfjsLib.getDocument({
                        url: pdfUrl
                    });

                pdf =
                    await loadingTask.promise;

                loading.remove();

                await renderPdf();

            } catch (error) {

                console.error(
                    "Unable to load CV:",
                    error
                );

                loading.innerHTML = `

                    <div class="pdf-fallback">

                        <p>
                            Unable to display the CV here.
                        </p>

                        <a
                            href="${pdfUrl}"
                            target="_blank"
                            rel="noopener noreferrer">

                            Open or download the CV

                        </a>

                    </div>

                `;
            }
        }

        /* Re-render after resize */

        let resizeTimer = null;

        window.addEventListener(
            "resize",
            () => {

                clearTimeout(
                    resizeTimer
                );

                resizeTimer =
                    setTimeout(
                        () => {

                            if (pdf) {
                                renderPdf();
                            }

                        },
                        250
                    );

            }
        );

        /* Fullscreen */

        fullscreenBtn.addEventListener(
            "click",
            async () => {

                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        await cvViewer.requestFullscreen();

                    } else {

                        await document.exitFullscreen();

                    }

                } catch (error) {

                    console.error(
                        "Fullscreen failed:",
                        error
                    );

                }

            }
        );

        /* Fullscreen icon */

        document.addEventListener(
            "fullscreenchange",
            () => {

                const isFullscreen =
                    document.fullscreenElement ===
                    cvViewer;

                fullscreenBtn.innerHTML =
                    isFullscreen

                        ? '<i class="fa-solid fa-compress" aria-hidden="true"></i>'

                        : '<i class="fa-solid fa-expand" aria-hidden="true"></i>';

                fullscreenBtn.setAttribute(
                    "aria-label",
                    isFullscreen
                        ? "Exit fullscreen"
                        : "Open CV in fullscreen"
                );

                fullscreenBtn.setAttribute(
                    "title",
                    isFullscreen
                        ? "Exit fullscreen"
                        : "Open CV in fullscreen"
                );

            }
        );

        /* Start */

        loadPdf();

    </script>
