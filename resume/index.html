<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CV | Nazmul Huda Badhon</title>
    <meta name="description" content="View and download the CV of Nazmul Huda Badhon.">

    <!-- Current favicon for UI -->
    <link rel="icon" type="image/png" href="./Image/favicon.png" />

    <!-- Root-level versions for Google and crawlers -->
    <link rel="icon" type="image/png" sizes="32x32" href="./Image/favicon.png" />
    <link rel="shortcut icon" href="./Image/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./Image/apple-touch-icon.png" />


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --page-max-width: 80rem;
            --desktop-padding: 3rem;
            --header-height: 36px;

            --color-background: #ffffff;
            --color-nav-background: #f2f2f2;
            --color-nav-hover: #e4e4e4;
            --color-nav-active: #243044;
            --color-text: #1f1f1f;
            --color-border: #dddddd;
            --color-focus: #a51c30;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        html {
            background: var(--color-background);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--color-background);
            color: var(--color-text);
            font-family: Arial, sans-serif;
        }

        a {
            color: inherit;
        }

        .skip-link {
            position: fixed;
            top: 0.5rem;
            left: 0.5rem;
            z-index: 10001;
            padding: 0.65rem 1rem;
            border-radius: 0.25rem;
            background: var(--color-focus);
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            transform: translateY(-150%);
            transition: transform 160ms ease;
        }

        .skip-link:focus {
            transform: translateY(0);
        }

        .desktop-header {
            display: none;
        }

        .cv-viewer {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .cv-frame {
            display: block;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            border: 0;
            background: var(--color-background);
        }

        .pdf-fallback {
            display: none;
            padding: 2rem;
            text-align: center;
        }

        .pdf-fallback a {
            font-weight: 700;
            color: var(--color-focus);
        }

        @media (min-width: 1024px) {
            body {
                display: flex;
                min-height: 100vh;
                min-height: 100dvh;
                flex-direction: column;
            }

            .desktop-header {
                position: sticky;
                top: 0;
                z-index: 9999;
                display: block;
                width: 100%;
                height: var(--header-height);
                flex: 0 0 var(--header-height);
                background: var(--color-background);
            }

            .desktop-header__inner {
                width: 100%;
                max-width: var(--page-max-width);
                height: 100%;
                margin: 0 auto;
                padding-inline: var(--desktop-padding);
            }

            .segmented-nav {
                display: grid;
                width: 100%;
                height: 100%;
                grid-template-columns:
                    minmax(100px, 1fr) minmax(130px, 1.15fr) minmax(100px, 1fr) minmax(130px, 1.15fr) minmax(70px, 0.7fr);
                overflow: hidden;
                border-inline: 1px solid var(--color-border);
                background: var(--color-nav-background);
            }

            .segmented-nav__link {
                display: inline-flex;
                min-width: 0;
                height: 100%;
                padding-inline: 0.875rem;
                align-items: center;
                justify-content: center;

                border-right: 1px solid #ffffff;
                background: var(--color-nav-background);
                color: var(--color-text);

                font-family: "Oswald", Arial, sans-serif;
                font-size: 0.9375rem;
                font-weight: 500;
                line-height: 1;

                text-align: center;
                text-decoration: none;
                white-space: nowrap;

                transition:
                    background-color 180ms ease,
                    color 180ms ease;
            }

            .segmented-nav__link:last-child {
                border-right: 0;
            }

            .segmented-nav__link:hover {
                background: var(--color-nav-hover);
                color: #111111;
            }

            .segmented-nav__link[aria-current="page"] {
                background: var(--color-nav-active);
                color: #ffffff;
            }

            .segmented-nav__link:focus-visible {
                position: relative;
                z-index: 1;
                outline: 2px solid var(--color-focus);
                outline-offset: -2px;
            }

            .cv-viewer {
                width: 100%;
                max-width: var(--page-max-width);
                min-height: 0;
                height: calc(100vh - var(--header-height));
                height: calc(100dvh - var(--header-height));
                margin: 0 auto;
                padding-inline: var(--desktop-padding);
                flex: 1 1 auto;
            }

            .cv-frame {
                width: 100%;
                height: 100%;
            }
        }

        @media (min-width: 1024px) and (max-width: 1120px) {
            :root {
                --desktop-padding: 1.5rem;
            }

            .segmented-nav__link {
                padding-inline: 0.625rem;
                font-size: 0.875rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }

        @media print {

            .desktop-header,
            .skip-link {
                display: none;
            }

            .cv-viewer,
            .cv-frame {
                width: 100%;
                height: 100%;
                padding: 0;
            }
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#cv-document">Skip to CV</a>

    <header class="desktop-header">
        <div class="desktop-header__inner">
            <nav class="segmented-nav" aria-label="Primary navigation">
                <a href="../" class="segmented-nav__link">Home</a>

                <a href="../research/" class="segmented-nav__link">
                    Publications
                </a>

                <a href="../projects/" class="segmented-nav__link">
                    Projects
                </a>

                <a href="../achievement/" class="segmented-nav__link">
                    Achievements
                </a>

                <a href="../resume/" class="segmented-nav__link" aria-current="page">
                    CV
                </a>
            </nav>
        </div>
    </header>

    <main id="cv-document" class="cv-viewer">
        <iframe class="cv-frame" src="../pdfs/CV_Nazmul_Huda_Badhon.pdf#zoom=125&view=FitH"
            title="Curriculum vitae of Nazmul Huda Badhon" loading="eager">
            <p class="pdf-fallback">
                Your browser cannot display this PDF.
                <a href="../pdfs/CV_Nazmul_Huda_Badhon.pdf">
                    Download the CV
                </a>.
            </p>
        </iframe>

        <noscript>
            <p class="pdf-fallback" style="display: block;">
                JavaScript is disabled, but you can still
                <a href="../pdfs/CV_Nazmul_Huda_Badhon.pdf">
                    download the CV
                </a>.
            </p>
        </noscript>
    </main>
</body>

</html>
