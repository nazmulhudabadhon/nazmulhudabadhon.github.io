<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CV | Nazmul Huda Badhon</title>

    <!-- Navigation font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Page reset */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #ffffff;
        }

        /* Full-screen PDF used by default and on phones */
        .cv-frame {
            display: block;
            width: 100%;
            height: 100vh;
            border: 0;
        }

        /* Desktop navigation is hidden on phones and tablets */
        .desktop-header {
            display: none;
        }

        /* Desktop CV layout */
        @media (min-width: 1024px) {

            body {
                display: flex;
                min-height: 100vh;
                flex-direction: column;
            }

            /* Sticky desktop navigation area */
            .desktop-header {
                position: sticky;
                top: 0;
                z-index: 9999;
                display: block;
                width: 100%;
                height: 36px;
                flex: 0 0 44px;
                background: #ffffff;
            }

            /* Matches the max-w-7xl page width */
            .desktop-header__inner {
                width: 100%;
                max-width: 80rem;
                height: 36px;
                margin: 0 auto;
                padding: 0 3rem;
            }

            /* Segmented navigation */
            .segmented-nav {
                display: grid;
                width: 100%;
                height: 36px;
                grid-template-columns:
                    minmax(100px, 1fr) minmax(130px, 1.15fr) minmax(100px, 1fr) minmax(130px, 1.15fr) minmax(70px, 0.7fr);

                overflow: hidden;
                border-right: 1px solid #e2e2e2;
                border-left: 1px solid #e2e2e2;
                background: #f2f2f2;
            }

            /* Individual navigation item */
            .segmented-nav__link {
                position: relative;
                display: inline-flex;
                min-width: 0;
                height: 100%;
                padding: 0 14px;
                align-items: center;
                justify-content: center;

                border-right: 1px solid #ffffff;
                background: #f2f2f2;
                color: #1f1f1f;

                font-family: "Oswald", Arial, sans-serif;
                font-size: 15px;
                font-weight: 500;
                line-height: 1;

                text-align: center;
                text-decoration: none;
                white-space: nowrap;

                transition:
                    background-color 180ms ease,
                    color 180ms ease;
            }

            .segmented-nav__link:last-child {
                border-right: 0;
            }

            .segmented-nav__link:hover {
                background: #e4e4e4;
                color: #111111;
            }

            /* Marks CV as the current page */
            .segmented-nav__link.is-active,
            .segmented-nav__link[aria-current="page"] {
                background: #303030;
                color: #ffffff;
            }

            .segmented-nav__link:focus-visible {
                z-index: 1;
                outline: 2px solid #a51c30;
                outline-offset: -2px;
            }

            /* Constrains the PDF to the same width as the navigation */
            .cv-viewer {
                width: 100%;
                max-width: 80rem;
                height: calc(100vh - 36px);
                margin: 0 auto;
                padding: 0 3rem;
                flex: 1;
            }

            .cv-frame {
                width: 100%;
                height: 100%;
                border: 0;
                background: #ffffff;
            }
        }

        /* Slightly smaller desktop-side padding */
        @media (min-width: 1024px) and (max-width: 1120px) {

            .desktop-header__inner,
            .cv-viewer {
                padding-right: 1.5rem;
                padding-left: 1.5rem;
            }

            .segmented-nav__link {
                padding: 0 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <!-- ===== DESKTOP TOP NAVBAR ===== -->
    <header class="desktop-header hidden lg:block">
        <div class="desktop-header__inner">
            <nav class="segmented-nav" aria-label="Main navigation">
                <a href="../" class="segmented-nav__link">Home</a>

                <a href="../research/" class="segmented-nav__link">Publications</a>

                <a href="../projects/" class="segmented-nav__link">Projects</a>

                <a href="../achievement/" class="segmented-nav__link">Achievements</a>

                <a href="../resume/" target="_blank" rel="noopener"
                    class="segmented-nav__link segmented-nav__link--cv is-active" aria-current="page">CV</a>
            </nav>
        </div>
    </header>

    <!-- PDF viewer -->
    <main class="cv-viewer">
        <iframe class="cv-frame" src="../pdfs/CV_Nazmul_Huda_Badhon.pdf#zoom=125" title="CV_Nazmul_Huda_Badhon"
            allowfullscreen></iframe>
    </main>

</body>

</html>
