<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CV | Nazmul Huda Badhon</title>
    <meta name="description" content="View and download the CV of Nazmul Huda Badhon.">

    <link rel="icon" type="image/png" href="../Image/favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../Image/favicon.png">
    <link rel="shortcut icon" href="../Image/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../Image/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../style/style.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* CV viewer */
        .cv-viewer {
            width: min(calc(100% - 48px), 1000px);
            min-height: 0;
            margin-inline: auto;
            flex: 1 1 auto;
        }

        .cv-frame {
            display: block;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            border: 0;
            background: #ffffff;
        }

        .pdf-fallback {
            padding: 32px 24px;
            color: var(--text-main);
            text-align: center;
        }

        .pdf-fallback a {
            color: var(--accent-red);
            font-weight: 600;
        }

        @media (min-width: 1024px) {
            .desktop-header {
                position: sticky;
                top: 0;
                z-index: 9999;
                display: block;
            }

            .cv-frame {
                height: calc(100vh - 50px);
                height: calc(100dvh - 50px);
            }
        }


        @media (max-width: 1023px) {
            .cv-viewer {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        @media print {
            .desktop-header {
                display: none !important;
            }

            .cv-viewer,
            .cv-frame {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>

<body class="cv-page">

    <header class="desktop-header">
        <div class="desktop-header__inner">

            <a href="../" class="desktop-brand" aria-label="Nazmul Huda Badhon home">
                Nazmul Huda Badhon
            </a>

            <nav class="segmented-nav" aria-label="Main navigation">

                <a href="../" class="segmented-nav__link">
                    Home
                </a>

                <a href="../research/" class="segmented-nav__link">
                    Publications
                </a>

                <a href="../projects/" class="segmented-nav__link">
                    Projects
                </a>

                <a href="../achievement/" class="segmented-nav__link">
                    Achievements
                </a>

                <a href="../resume/" class="segmented-nav__link segmented-nav__link--cv is-active" aria-current="page">
                    CV
                </a>

                <button id="themeToggle" class="desktop-theme-toggle" type="button" aria-label="Switch to dark mode"
                    title="Switch to dark mode" aria-pressed="false">
                    <i class="fa-regular fa-moon" aria-hidden="true"></i>
                </button>

            </nav>
        </div>
    </header>

    <main id="cv-document" class="cv-viewer">

        <iframe class="cv-frame" src="../pdfs/CV_Nazmul_Huda_Badhon.pdf#zoom=125&view=FitH"
            title="Curriculum vitae of Nazmul Huda Badhon" loading="eager">

            <p class="pdf-fallback">
                Your browser cannot display this PDF.
                <a href="../pdfs/CV_Nazmul_Huda_Badhon.pdf">
                    Download the CV
                </a>.
            </p>

        </iframe>

        <noscript>
            <p class="pdf-fallback">
                JavaScript is disabled, but you can still
                <a href="../pdfs/CV_Nazmul_Huda_Badhon.pdf">
                    download the CV
                </a>.
            </p>
        </noscript>

    </main>

    <script src="../index.js"></script>
</body>

</html>
