<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CV | Nazmul Huda Badhon</title>
    <meta name="description" content="View and download the CV of Nazmul Huda Badhon.">

    <link rel="icon" type="image/png" sizes="32x32"
        href="https://res.cloudinary.com/a3xhs0jd/image/upload/f_auto,q_auto/v1786223898/favicon.png">

    <link rel="icon" type="image/png"
        href="https://res.cloudinary.com/a3xhs0jd/image/upload/f_auto,q_auto/v1786223898/favicon.png">

    <link rel="shortcut icon"
        href="https://res.cloudinary.com/a3xhs0jd/image/upload/f_auto,q_auto/v1786223837/favicon_qq6rld.ico">

    <link rel="apple-touch-icon" sizes="180x180"
        href="https://res.cloudinary.com/a3xhs0jd/image/upload/f_auto,q_auto/v1786223017/apple-touch-icon.png">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/fontawesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/solid.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/regular.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/brands.min.css">

    <!-- Font Awesome icon fonts -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-regular-400.woff2"
        as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-solid-900.woff2"
        as="font" type="font/woff2" crossorigin>

    <!-- Local fonts -->
    <link rel="preload" href="../fonts/SourceSans3-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/SourceSans3-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/SourceSans3-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/SourceSans3-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/SourceSans3-Italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/SourceSerif4-VariableFont_opsz,wght.woff2" as="font" type="font/woff2"
        crossorigin>

    <!-- Styles -->
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/tailwind-built.css">


    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem("site-theme");
                const systemDark =
                    window.matchMedia("(prefers-color-scheme: dark)").matches;

                const theme =
                    savedTheme || (systemDark ? "dark" : "light");

                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            } catch (error) {
                document.documentElement.dataset.theme = "light";
                document.documentElement.style.colorScheme = "light";
            }
        })();
    </script>

    <style>
        /* Base */
        html {
            scrollbar-gutter: stable;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }


        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* CV viewer */

        .cv-viewer {
            position: relative;

            /* The PDF is 768px wide */
            width: 768px;
            max-width: calc(100vw - 48px);

            height: calc(100dvh - 50px);

            margin: 0 auto;
            min-height: 0;
        }

        .cv-frame-wrapper {
            width: 100%;
            height: 100%;
        }

        .cv-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .cv-fullscreen-btn {
            position: absolute;

            /* Put it outside the 768px PDF */
            left: calc(100% + 12px);
            top: 8px;

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: 1px solid var(--border-color, #ccc);
            border-radius: 8px;

            background: var(--bg-main, #fff);
            color: var(--text-main);

            cursor: pointer;
            font-size: 15px;

            z-index: 100;
        }

        .cv-fullscreen-btn:hover {
            opacity: 0.75;
        }

        .pdf-fallback {
            padding: 32px 24px;
            color: var(--text-main);
            text-align: center;
        }

        .pdf-fallback a {
            color: var(--accent-red);
            font-weight: 600;
        }

        /* Desktop header */

        @media (min-width: 1024px) {
            .desktop-header {
                position: sticky;
                top: 0;
                z-index: 9999;
            }

            .cv-page .desktop-theme-toggle {
                margin: 0 !important;
                margin-left: 0 !important;
            }

            .cv-frame {
                height: calc(100vh - 50px);
                height: calc(100dvh - 50px);
            }
        }

        /* Reduced motion */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        /* Print */

        @media print {
            .desktop-header {
                display: none !important;
            }

            .cv-viewer,
            .cv-frame {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>

<body class="cv-page">

    <!-- Desktop top navbar -->

    <header class="desktop-header">
        <div class="desktop-header__inner">

            <a href="../" class="desktop-brand" aria-label="Nazmul Huda Badhon home">
                <span style="font-weight: 600;">Nazmul Huda</span>&nbsp;Badhon
            </a>

            <nav class="segmented-nav" aria-label="Main navigation">

                <a href="../" class="segmented-nav__link">
                    Home
                </a>

                <a href="../research/" class="segmented-nav__link">
                    Publications
                </a>

                <a href="../projects/" class="segmented-nav__link">
                    Projects
                </a>

                <a href="../achievement/" class="segmented-nav__link">
                    Achievements
                </a>

                <a href="../resume/" class="segmented-nav__link segmented-nav__link--cv is-active" aria-current="page">
                    CV
                </a>

            </nav>

            <button id="themeToggle" class="desktop-theme-toggle" type="button" aria-label="Switch to dark mode"
                title="Switch to dark mode" aria-pressed="false">

                <i class="fa-regular fa-moon" aria-hidden="true"></i>

            </button>

        </div>
    </header>

    <!-- CV document -->

    <main id="cv-document" class="cv-viewer">

        <div class="cv-frame-wrapper">

            <iframe class="cv-frame" src="../pdfs/CV_Nazmul_Huda_Badhon.pdf"
                title="Curriculum vitae of Nazmul Huda Badhon" loading="eager">

                <p class="pdf-fallback">
                    Your browser cannot display this PDF.
                    <a href="../pdfs/CV_Nazmul_Huda_Badhon.pdf">
                        Download the CV
                    </a>.
                </p>

            </iframe>

        </div>

        <button id="fullscreenBtn" class="cv-fullscreen-btn" type="button" aria-label="Open CV in fullscreen"
            title="Open CV in fullscreen">

            <i class="fa-solid fa-expand" aria-hidden="true"></i>

        </button>

        <noscript>
            <p class="pdf-fallback">
                JavaScript is disabled, but you can still
                <a href="../pdfs/CV_Nazmul_Huda_Badhon.pdf">
                    download the CV
                </a>.
            </p>
        </noscript>

    </main>

    <script>
        const cvViewer = document.getElementById("cv-document");
        const fullscreenBtn = document.getElementById("fullscreenBtn");
        const cvFrame = document.querySelector(".cv-frame");

        const normalPdf = "../pdfs/CV_Nazmul_Huda_Badhon.pdf";
        const fullscreenPdf = "../pdfs/CV_Nazmul_Huda_Badhon.pdf#zoom=150";

        let wasFullscreen = false;

        fullscreenBtn.addEventListener("click", async () => {
            try {
                if (!document.fullscreenElement) {

                    // Load PDF at 150% before entering fullscreen
                    cvFrame.src = fullscreenPdf;

                    // Wait briefly for Chrome's PDF viewer to initialize
                    await new Promise(resolve => setTimeout(resolve, 150));

                    wasFullscreen = true;

                    await cvViewer.requestFullscreen();

                } else {
                    await document.exitFullscreen();
                }

            } catch (error) {
                console.error("Fullscreen failed:", error);
            }
        });

        document.addEventListener("fullscreenchange", () => {
            const isFullscreen = document.fullscreenElement === cvViewer;

            fullscreenBtn.innerHTML = isFullscreen
                ? '<i class="fa-solid fa-compress" aria-hidden="true"></i>'
                : '<i class="fa-solid fa-expand" aria-hidden="true"></i>';

            fullscreenBtn.setAttribute(
                "aria-label",
                isFullscreen ? "Exit fullscreen" : "Open CV in fullscreen"
            );

            fullscreenBtn.setAttribute(
                "title",
                isFullscreen ? "Exit fullscreen" : "Open CV in fullscreen"
            );

            // Return to normal PDF zoom when leaving fullscreen
            if (!isFullscreen && wasFullscreen) {

                cvFrame.src = "";

                requestAnimationFrame(() => {
                    cvFrame.src = normalPdf;
                });

                wasFullscreen = false;
            }
        });
    </script>

    <script src="../index.js"></script>

</body>

</html>
